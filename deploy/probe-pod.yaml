# Throwaway pod for calling the sandbox by hand (T4). Budget: 50m / 64Mi requests, 100m / 64Mi limits.
# The key arrives through envFrom and is only ever expanded inside the pod.
apiVersion: v1
kind: Pod
metadata:
  name: probe
  labels: { app: probe }
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  containers:
    - name: probe
      image: curlimages/curl:8.11.1
      command: ["sleep", "3600"]
      envFrom:
        - secretRef: { name: huawei-gateway }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 100m, memory: 64Mi }
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        allowPrivilegeEscalation: false
